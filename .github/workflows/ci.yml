name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          cache: true
          install: false

      - name: Verify tool versions
        run: |
          expected_node_version="v$(cat .node-version)"
          actual_node_version="$(node --version)"
          printf 'Node.js: %s (expected %s)\n' "$actual_node_version" "$expected_node_version"
          test "$actual_node_version" = "$expected_node_version"

          expected_package_manager="$(node -p "require('./package.json').packageManager")"
          actual_package_manager="pnpm@$(pnpm --version)"
          printf 'pnpm: %s (expected %s)\n' "$actual_package_manager" "$expected_package_manager"
          test "$actual_package_manager" = "$expected_package_manager"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
